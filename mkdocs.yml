site_name: Rubén Jiménez Mejías
site_description: Portfolio of Rubén Jiménez Mejías — engineering projects, writing, and CV
site_author: Rubén Jiménez Mejías
site_url: https://rubenayla.xyz/

# Video sidecar .md files live next to their MP4 in docs/videos/; they're
# metadata for agents (rating, source, status), not rendered pages.
exclude_docs: |
  videos/*.md


theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.annotate
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  # `search` is MkDocs' default plugin. Declaring any `plugins:` key replaces the
  # default list, so it has to be named explicitly or site search disappears.
  - search
  - redirects:
      # OBSOLETE URL, KEPT ON PURPOSE — do not delete.
      #
      # The build journey used to live at the top-level `/build-journey/`. That was
      # wrong: every entry on it is about the driverless kart, so a site-wide URL
      # claimed far more than the page held, and there is no room left for the build
      # log of any other project. It now lives at `/projects/kart/build-journey/`.
      #
      # The old address cannot simply disappear. It was printed in the cover letter
      # sent to Duatic on 2026-08-14, so a recruiter holds that link, and the
      # per-post anchors (`/build-journey/#motor`, `#battery`, ...) were published as
      # stable URLs. This redirect keeps both working; mkdocs-redirects copies the
      # `#anchor` across in JavaScript, so deep links survive too.
      #
      # Retire it once the sent applications are old enough not to matter — roughly
      # 2027, or whenever the Duatic thread is closed. Full story:
      # `history.md`, 2026-08-16.
      redirect_maps:
        'build-journey/index.md': 'projects/kart/build-journey.md'

nav:
  - Home: index.md
  - Driverless Kart:
      - Overview: projects/kart/index.md
      - Build Journey: projects/kart/build-journey.md
  - Formula Student: projects/formula-student.md
  - Partle: projects/partle.md
  - Cyberwheel: projects/cyberwheel.md
  - Investment Analysis: projects/invest.md
  - Writing:
      - Overview: writing/index.md
      - Essays:
          - US Healthcare Costs:
              - Essay: writing/healthcare/index.md
              - Main Analysis Tree: writing/healthcare/main-tree.md
  - About: about.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rubenayla
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/rubenayla/
      name: LinkedIn
    - icon: fontawesome/solid/cube
      link: https://grabcad.com/ruben.jimenez-15/models
      name: GrabCAD
    - icon: fontawesome/solid/book
      link: https://notes.rubenayla.xyz/
      name: Notes
